# NOTE: No properties on purpose, and none are possible: struct iio_desc is opaque, defined
# in iio.c:196 rather than a header, so nothing outside the IIO core can read or write a
# field. This schema exists as a type name for `include` to match. The only value that ever
# reaches it is the app's own descriptor, which iio_app_init allocates.
