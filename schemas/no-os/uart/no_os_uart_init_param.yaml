$id: "no-os/uart/no_os_uart_init_param.yaml"
$type: struct
$symbol: no_os_uart_init_param
$capability: uart
$description: "Structure holding the parameters for UART initialization"
$ranking: 4
$config:
  - "UART"
$sources:
  noos:
    - "include/no_os_uart.h"

device_id:
  type: uint8_t
  required: true
  maximum: 10
  description: "UART peripheral device ID"

# NOTE: `uint32_t` in C, but never written as a number: every platform numbers its
# interrupts with an SDK enum, and upstream no-OS always assigns the token itself
# (UART0_IRQn on maxim, USART2_IRQn on stm32, ADUCM_UART_INT_ID on aducm3029). Modelled
# as raw so the platform's own name survives into the generated code, which is also what
# makes max_usb_uart_ops expressible - it needs USB_IRQn here, not a UART line at all.
irq_id:
  type: raw
  description: "UART interrupt ID, as the platform SDK names it, e.g. UART0_IRQn"

asynchronous_rx:
  type: bool
  default: false
  description: "If set, the reception is interrupt driven"

baud_rate:
  type: uint32_t
  required: true
  description: "UART baud rate in bits per second"

size:
  include: "no-os/enums/no_os_uart_size.yaml"
  description: "UART character size (number of data bits)"

parity:
  include: "no-os/enums/no_os_uart_parity.yaml"
  description: "UART parity configuration"

stop:
  include: "no-os/enums/no_os_uart_stop.yaml"
  description: "UART number of stop bits"

platform_ops:
  type: platform_ops
  capability: uart
  target: no_os_uart_platform_ops
  required: true
  description: "Platform-specific UART operations"

extra:
  type: platform_extra
  capability: uart
  required: true
  description: "Platform-specific initialization parameters"
