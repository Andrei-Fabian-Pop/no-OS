$id: "no-os/spi/no_os_spi_init_param.yaml"
$type: struct
$symbol: no_os_spi_init_param
$capability: spi
$description: "Structure holding the parameters for SPI initialization"
$ranking: 4
$sources:
  noos:
    - "include/no_os_spi.h"
    - "drivers/api/no_os_spi.c"

device_id:
  type: uint32_t
  required: true
  # Evidence: drivers/api/no_os_spi.c:62 `if (param->device_id > SPI_MAX_BUS_NUMBER) return -EINVAL;`
  # with include/no_os_spi.h:41 `#define SPI_MAX_BUS_NUMBER 8` (strict >, so 8 is valid)
  maximum: 8
  description: "SPI peripheral device ID"

max_speed_hz:
  type: uint32_t
  description: "Maximum SPI clock frequency in Hz"

chip_select:
  type: uint8_t
  required: true
  description: "Chip select line number"

mode:
  include: "no-os/enums/no_os_spi_mode.yaml"
  description: "SPI mode (clock polarity and phase)"

bit_order:
  include: "no-os/enums/no_os_spi_bit_order.yaml"
  description: "Bit order (MSB or LSB first)"

platform_ops:
  type: platform_ops
  capability: spi
  required: true
  description: "Platform-specific SPI operations"

extra:
  type: platform_extra
  capability: spi
  required: true
  description: "Platform-specific initialization parameters"

parent:
  include: "no-os/spi/no_os_spi.yaml"
  pointer: true
  description: "Parent SPI descriptor for devices behind expanders"
