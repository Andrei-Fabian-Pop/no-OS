$id: "platforms/pico/pico_uart_init_param.yaml"
$type: struct
$symbol: pico_uart_init_param
$capability: uart
$description: "Pico platform specific UART initialization parameters"
$ranking: 4
$sources:
  platform:
    - "pico_uart.h"

uart_tx_pin:
  include: "platforms/pico/enums/uart_tx_gp.yaml"
  description: "UART TX pin configuration"

uart_rx_pin:
  include: "platforms/pico/enums/uart_rx_gp.yaml"
  description: "UART RX pin configuration"

$override:
  - $parent:
      device_id:
        minimum: 0
        maximum: 1

      size:
        values:
          [NO_OS_UART_CS_5, NO_OS_UART_CS_6, NO_OS_UART_CS_7, NO_OS_UART_CS_8]

      parity:
        values: [NO_OS_UART_PAR_NO, NO_OS_UART_PAR_ODD, NO_OS_UART_PAR_EVEN]

  # UART0 (device_id = 0) can only use UART0_* pins
  - $if:
      $parent:
        device_id:
          value: 0
    $then:
      $this:
        uart_tx_pin:
          values: [UART0_TX_GP0, UART0_TX_GP12, UART0_TX_GP16]
        uart_rx_pin:
          values: [UART0_RX_GP1, UART0_RX_GP13, UART0_RX_GP17]

  # UART1 (device_id = 1) can only use UART1_* pins
  - $if:
      $parent:
        device_id:
          value: 1
    $then:
      $this:
        uart_tx_pin:
          values: [UART1_TX_GP4, UART1_TX_GP8]
        uart_rx_pin:
          values: [UART1_RX_GP5, UART1_RX_GP9]
