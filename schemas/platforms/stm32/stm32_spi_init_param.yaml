$id: "platforms/stm32/stm32_spi_init_param.yaml"
$type: struct
$symbol: stm32_spi_init_param
$capability: spi
$description: "STM32 platform specific SPI initialization parameters"
$ranking: 4
$config: []
$sources:
  platform:
    - "stm32_spi.h"

chip_select_port:
  type: uint32_t
  minimum: 0
  maximum: 10
  description: "Chip select port (GPIOA=0 .. GPIOK=10)"

# Opaque function pointer, signature uint32_t (*)(void). Optional. Emitted verbatim;
# the user provides the function name, e.g. "HAL_RCC_GetPCLK2Freq".
get_input_clock:
  type: raw
  description: "Get peripheral source clock function, signature uint32_t (*)(void). Written verbatim, e.g. HAL_RCC_GetPCLK2Freq."

alternate:
  type: uint32_t
  description: "Chip select alternate function"

irq_num:
  type: uint32_t
  description: "IRQ number"

dma_init:
  include: "no-os/dma/no_os_dma_init_param.yaml"
  description: "DMA initialization parameters"

rxdma_ch:
  include: "platforms/stm32/stm32_dma_channel.yaml"
  description: "RX DMA channel descriptor"

txdma_ch:
  include: "platforms/stm32/stm32_dma_channel.yaml"
  description: "TX DMA channel descriptor"

pwm_init:
  include: "no-os/pwm/no_os_pwm_init_param.yaml"
  description: "CS PWM initialization parameters (optional, requires HAL_TIM_MODULE_ENABLED)"

tx_pwm_init:
  include: "no-os/pwm/no_os_pwm_init_param.yaml"
  description: "TX PWM initialization parameters (optional, requires HAL_TIM_MODULE_ENABLED)"
