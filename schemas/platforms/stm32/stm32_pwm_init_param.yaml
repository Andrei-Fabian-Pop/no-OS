$id: "platforms/stm32/stm32_pwm_init_param.yaml"
$type: struct
$symbol: stm32_pwm_init_param
$capability: pwm
$description: "STM32 platform specific PWM initialization parameters"
$ranking: 4
$config: []
$sources:
  platform:
    - "stm32_pwm.h"

# Opaque external HAL handle (declared void* in the driver). stm32_pwm.c:114 casts
# htimer to TIM_HandleTypeDef then :183-184 dereferences htimer->Instance/Init
# unconditionally (no NULL check) -> mandatory. Emitted verbatim; the user provides
# the address of a TIM_HandleTypeDef, e.g. "&htim1".
htimer:
  type: raw
  required: true
  description: "PWM timer handle (void *, a TIM_HandleTypeDef * from STM32CubeMX). Written verbatim, e.g. &htim1."

pwm_timer:
  type: enum
  values: [TIMER1, TIMER2, TIMER3, TIMER4, TIMER5, TIMER6, TIMER7, TIMER8]
  description: "Type of timer used for PWM"

prescaler:
  type: uint32_t
  description: "Timer prescaler (0 to 0xFFFF)"

timer_autoreload:
  type: bool
  description: "Timer autoreload enable"

mode:
  type: enum
  values: [TIM_OC_TOGGLE, TIM_OC_PWM1, TIM_OC_PWM2]
  description: "Timer output compare mode"

timer_chn:
  type: uint32_t
  minimum: 1
  maximum: 6
  description: "PWM timer channel (TIM: 1..6, channels 5-6 target-dependent; LPTIM: 1..2)"

complementary_channel:
  type: bool
  description: "Use complementary channel"

# Opaque function pointer, signature uint32_t (*)(void). Optional. Emitted verbatim;
# the user provides the function name, e.g. "HAL_RCC_GetPCLK1Freq".
get_timer_clock:
  type: raw
  description: "Get timer source clock function, signature uint32_t (*)(void). Written verbatim, e.g. HAL_RCC_GetPCLK1Freq."

clock_divider:
  type: uint32_t
  description: "Timer clock divider"

dma_enable:
  type: bool
  description: "Enable DMA for PWM"

dma:
  include: "no-os/dma/no_os_dma_init_param.yaml"
  description: "DMA initialization parameters"

dma_ch:
  include: "platforms/stm32/stm32_dma_channel.yaml"
  description: "DMA channel descriptor"

onepulse_enable:
  type: bool
  description: "Enable one-pulse mode"
