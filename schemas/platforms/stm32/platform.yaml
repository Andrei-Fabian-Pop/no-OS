vendor: stm32
description: >-
  STMicroelectronics STM32 platform. A broad family of Arm Cortex-M
  microcontrollers, typically configured with STM32CubeMX/CubeIDE and built on
  the STM32 HAL. This is the most fully featured target here, providing SPI,
  I2C, UART, GPIO (with GPIO interrupts), PWM, interrupts, timers and DMA.
  Choose this for firmware running on any STM32-based board.

ops:
  - platform_ops/spi_ops.yaml
  - platform_ops/i2c_ops.yaml
  - platform_ops/gpio_ops.yaml
  - platform_ops/gpio_irq_ops.yaml
  - platform_ops/uart_ops.yaml
  - platform_ops/pwm_ops.yaml
  - platform_ops/irq_ops.yaml
  - platform_ops/timer_ops.yaml
  - platform_ops/dma_ops.yaml

structs:
  - stm32_spi_init_param.yaml
  - stm32_i2c_init_param.yaml
  - stm32_gpio_init_param.yaml
  - stm32_gpio_irq_init_param.yaml
  - stm32_uart_init_param.yaml
  - stm32_pwm_init_param.yaml
  - stm32_timer_init_param.yaml
  - stm32_dma_init_param.yaml
