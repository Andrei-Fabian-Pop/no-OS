$id: "platforms/stm32/stm32_dma_channel.yaml"
$type: struct
$symbol: stm32_dma_channel
$description: "STM32 DMA channel configuration"
$ranking: 4
$sources:
  platform:
    - "stm32_dma.h"

# Opaque external HAL handle. stm32_dma.c:64/66 dereferences hdma->Init/Instance
# and :130 HAL_DMA_Init(hdma) unconditionally (no NULL check) -> mandatory when a
# DMA channel is used. Emitted verbatim; the user provides the address of a
# DMA_HandleTypeDef, e.g. "&hdma_spi1_rx".
hdma:
  type: raw
  required: true
  description: "DMA handle (DMA_HandleTypeDef *, managed by STM32CubeMX). Written verbatim, e.g. &hdma_spi1_rx."

ch_num:
  type: uint32_t
  description: "Channel number"

mem_increment:
  type: bool
  default: true
  description: "Memory address increment enable"

per_increment:
  type: bool
  default: false
  description: "Peripheral address increment enable"

mem_data_alignment:
  include: "platforms/stm32/enums/stm32_dma_data_alignment.yaml"
  description: "Memory data alignment"

per_data_alignment:
  include: "platforms/stm32/enums/stm32_dma_data_alignment.yaml"
  description: "Peripheral data alignment"

dma_mode:
  include: "platforms/stm32/enums/stm32_dma_mode.yaml"
  description: "DMA mode"
