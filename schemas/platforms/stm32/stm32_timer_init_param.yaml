$id: "platforms/stm32/stm32_timer_init_param.yaml"
$type: struct
$symbol: stm32_timer_init_param
$capability: timer
$description: "STM32 platform specific timer initialization parameters"
$ranking: 4
$config: []
$sources:
  platform:
    - "stm32_timer.h"
    - "stm32_timer.c"

# Opaque external HAL handle. stm32_timer.c:155 dereferences htimer->Instance
# unconditionally (no NULL check) -> mandatory. Emitted verbatim; the user provides
# the address of a TIM_HandleTypeDef, e.g. "&htim2".
htimer:
  type: raw
  required: true
  description: "HAL timer handle (TIM_HandleTypeDef *, from STM32CubeMX). Written verbatim, e.g. &htim2."
