$id: "platforms/stm32/stm32_uart_init_param.yaml"
$type: struct
$symbol: stm32_uart_init_param
$capability: uart
$description: "STM32 platform specific UART initialization parameters"
$ranking: 4
$config: []
$sources:
  platform:
    - "stm32_uart.h"

# Opaque external HAL handle. stm32_uart.c:88-89 dereferences huart->Init.BaudRate
# unconditionally (no NULL check) -> mandatory. Emitted verbatim; the user provides
# the address of a UART_HandleTypeDef, e.g. "&huart1".
huart:
  type: raw
  required: true
  description: "UART instance handle (UART_HandleTypeDef *, from STM32 HAL). Written verbatim, e.g. &huart1."

timeout:
  type: uint32_t
  description: "UART transaction timeout (HAL_IncTick() units)"
