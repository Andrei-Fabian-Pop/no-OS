vendor: xilinx
description: >-
  AMD Xilinx platform. Targets Zynq / Zynq UltraScale+ SoCs and MicroBlaze
  soft-cores on FPGAs, built with the Vitis/XSDK BSP. Beyond the usual
  interfaces it adds FPGA-specific SPI paths (AXI SPI Engine and PL SPI) for
  high-throughput data converters. Provides SPI (plus SPI Engine / PL SPI),
  I2C, UART, GPIO (with GPIO interrupts), interrupts and timers. Choose this
  for designs running on a Xilinx SoC/FPGA.

ops:
  - platform_ops/spi_ops.yaml
  - platform_ops/spi_engine_ops.yaml
  - platform_ops/spi_pl_ops.yaml
  - platform_ops/i2c_ops.yaml
  - platform_ops/gpio_ops.yaml
  - platform_ops/gpio_irq_ops.yaml
  - platform_ops/uart_ops.yaml
  - platform_ops/irq_ops.yaml
  - platform_ops/timer_ops.yaml

structs:
  - xil_spi_init_param.yaml
  - xil_i2c_init_param.yaml
  - xil_gpio_init_param.yaml
  - xil_gpio_irq_init_param.yaml
  - xil_uart_init_param.yaml
  - xil_irq_init_param.yaml
  - xil_timer_init_param.yaml
