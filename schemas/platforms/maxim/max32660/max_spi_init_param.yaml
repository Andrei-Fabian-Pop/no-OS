$id: "platforms/maxim/max32660/max_spi_init_param.yaml"
$type: struct
$symbol: max_spi_init_param
$capability: spi
$description: "Maxim MAX32660 platform specific SPI initialization parameters"
$ranking: 4
$config: []
$sources:
  platform:
    - "maxim_spi.h"

num_slaves:
  type: uint32_t
  description: "Number of slaves"

polarity:
  include: "platforms/maxim/max32660/enums/spi_ss_polarity.yaml"
  description: "Slave select polarity"

vssel:
  include: "platforms/maxim/max32660/enums/mxc_gpio_vssel.yaml"
  description: "GPIO voltage select"

dma_param:
  include: "no-os/dma/no_os_dma_init_param.yaml"
  pointer: true
  description: "DMA initialization parameters (pointer to DMA init struct, NULL if not used)"

dma_rx_priority:
  type: uint32_t
  description: "DMA RX priority"

dma_tx_priority:
  type: uint32_t
  description: "DMA TX priority"

$override:
  $parent:
    # device_id <= MXC_SPI_INSTANCES-1. MXC_SPI_INSTANCES=1 (max32660.h), so the
    # only valid instance is SPI0 (maxim_spi.c checks device_id >= MXC_SPI_INSTANCES).
    - device_id:
        default: 0
        maximum: 0
    # No chip_select constraint: unlike max32650/max32690, the max32660 SPI driver
    # has no _max_spi_config_pins() switch and no -EINVAL bound check on chip_select
    # (maxim_spi.c only mirrors it into NO_OS_BIT(desc->chip_select)), so no reliable
    # maximum can be asserted.
