# NOTE: the whole struct (iio_ad413x.h:44-46), and the member is held BY VALUE, not by pointer.
#
# NOTE: the wrapper takes the *configuration*, not a built descriptor: ad413x_iio_init calls
# ad413x_init itself (iio_ad413x.c:444), so a workfile must not also carry an `ad413x`
# descriptor node for the same device or it would be brought up twice.
#
# NOTE: AFE_IIO_AD413X selects AFE_AD413X, but AFE_AD413X `depends on SPI` and the whole block
# is inside `if AFE` (drivers/afe/Kconfig). A `select` closes a chain, a `depends on` never
# does, so AFE is named here; SPI comes from the spi node ad413x_init_param needs.
