# schemas/devices/adi,adxl355.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "adi,adxl355.yaml"
title: "ADXL355 no-OS Driver Configuration"
description: "Configuration schema for ADXL355 accelerometer in no-OS projects"

type: object
required:
  - comm_init
  - comm_type
  - dev_type

properties:
  comm_type:
    type: string
    enum: [ADXL355_SPI_COMM, ADXL355_I2C_COMM]
    description: "Communication interface type"
    default: "ADXL355_SPI_COMM"

  dev_type:
    type: string
    enum: [ID_ADXL355, ID_ADXL357, ID_ADXL359]
    description: "Device variant"
    default: "ID_ADXL355"

  comm_init:
    type: object
    description: "Device Communication initialization structure (union: either SPI or I2C)"
    properties:
      spi_init:
        $ref: "../no-os/no_os_spi_init_param.yaml"
        description: "SPI Initialization structure"

      i2c_init:
        $ref: "../no-os/no_os_i2c_init_param.yaml"
        description: "I2C Initialization structure"

    allOf:
      - if:
          properties:
            comm_type:
              const: ADXL355_SPI_COMM
        then:
          required:
            - spi_init
      - if:
          properties:
            comm_type:
              const: ADXL355_I2C_COMM
        then:
          required:
            - i2c_init

# Mapping to no-OS source files
x-noos-sources:
  driver_header: "drivers/accel/adxl355/adxl355.h"
  driver_source: "drivers/accel/adxl355/adxl355.c"
  iio_header: "drivers/accel/adxl355/iio_adxl355.h"
  iio_source: "drivers/accel/adxl355/iio_adxl355.c"
