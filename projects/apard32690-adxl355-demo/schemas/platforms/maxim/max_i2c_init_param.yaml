# schemas/platforms/maxim/max_i2c_init_param.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "maxim_i2c.h/max_i2c_init_param"
title: "max_i2c_init_param"
description: "Structure holding the initialization parameters for Maxim platform specific I2C parameters"

type: object
properties:
