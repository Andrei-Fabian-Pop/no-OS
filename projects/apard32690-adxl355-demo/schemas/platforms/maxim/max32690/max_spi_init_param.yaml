# schemas/platforms/maxim/max32690/max_spi_init_param.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "maxim_spi.h/max_spi_init_param"
title: "max_spi_init_param"
description: "Structure holding the initialization parameters for Maxim MAX32690 platform specific SPI parameters"

type: object
properties:
  num_slaves:
    type: uint32_t
    description: "Number of slaves"

  polarity:
    $ref: "../enums/spi_ss_polarity.yaml"
    description: "Slave select polarity"

  vssel:
    $ref: "../enums/mxc_gpio_vssel.yaml"
    description: "GPIO voltage select"

  dma_param:
    $ref: "../../../no-os/no_os_dma_init_param.yaml"
    description: "DMA Initialization Parameters"

  dma_rx_priority:
    type: uint32_t
    description: "DMA RX priority"

  dma_tx_priority:
    type: uint32_t
    description: "DMA TX priority"

# Mapping to no-OS source files
x-noos-sources:
  header: "drivers/platform/maxim/max32690/maxim_spi.h"
