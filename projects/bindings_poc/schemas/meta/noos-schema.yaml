# schemas/meta/noos-schema.yaml
# Meta-schema defining custom types and rules for no-OS driver configuration schemas
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "noos-schema"
title: "no-OS Schema Meta-Schema"
description: |
  Meta-schema for no-OS driver configuration schemas.
  Extends JSON Schema with C-specific types and platform abstraction patterns.

# =============================================================================
# Custom Types
# =============================================================================
# These types extend the standard JSON Schema "type" keyword to support
# C language types used in no-OS driver structs.

$defs:
  # ---------------------------------------------------------------------------
  # C Integer Types
  # ---------------------------------------------------------------------------
  # Maps to standard C integer types. Code generators should emit the
  # corresponding C type in generated structs.

  uint8_t:
    description: "Unsigned 8-bit integer (0 to 255)"
    type: integer
    minimum: 0
    maximum: 255

  uint16_t:
    description: "Unsigned 16-bit integer (0 to 65535)"
    type: integer
    minimum: 0
    maximum: 65_535

  uint32_t:
    description: "Unsigned 32-bit integer (0 to 4294967295)"
    type: integer
    minimum: 0
    maximum: 4_294_967_295

  uint64_t:
    description: "Unsigned 64-bit integer"
    type: integer
    minimum: 0
    maximum: 18_446_744_073_709_551_615
    # FIXME: Figure out how to repr a bigint maybe??

  int8_t:
    description: "Signed 8-bit integer (-128 to 127)"
    type: integer
    minimum: -128
    maximum: 127

  int16_t:
    description: "Signed 16-bit integer (-32768 to 32767)"
    type: integer
    minimum: -32_768
    maximum: 32_767

  int32_t:
    description: "Signed 32-bit integer"
    type: integer
    minimum: -2_147_483_648
    maximum: 2_147_483_647

  int64_t:
    description: "Signed 64-bit integer"
    type: integer
    minimum: -9_223_372_036_854_775_808
    maximum: 9_223_372_036_854_775_807

  # ---------------------------------------------------------------------------
  # Pointer Types
  # ---------------------------------------------------------------------------

  voidptr:
    description: |
      Void pointer (void*). Represents a generic pointer that can point to any type.
      In schemas, this typically indicates a field that holds device-specific or
      platform-specific data whose type is determined at runtime or by context.
    type: "null"
    x-c-type: "void*"

  # ---------------------------------------------------------------------------
  # Platform Abstraction Types
  # ---------------------------------------------------------------------------

  platform_extra:
    description: |
      Platform-specific extra parameters. This type indicates that the field
      should reference a platform-specific struct (e.g., max_spi_init_param for
      Maxim, stm32_spi_init_param for STM32, xil_spi_init_param for Xilinx).

      Usage:
        extra:
          type: platform_extra
          oneOf:
            - $ref: "../platforms/maxim/max_spi_init_param.yaml"
            - $ref: "../platforms/stm32/stm32_spi_init_param.yaml"

      Code generators should:
        1. Emit a void* field in the struct
        2. Generate platform-specific initialization based on build target
    type: object
    x-c-type: "void*"
    x-requires-platform-selection: true

  # ---------------------------------------------------------------------------
  # Debugging / Placeholder Types
  # ---------------------------------------------------------------------------

  unknown:
    description: |
      Placeholder for types that don't have a schema solution yet.
      Used during schema development to mark gaps without blocking progress.

      Code generators should:
        1. Emit a warning indicating this field needs resolution
        2. Use the x-c-type override if provided, otherwise default to void*
        3. Generate a TODO comment in the output

      Usage:
        some_complex_field:
          type: unknown
          x-c-type: "struct some_opaque_type *"
          x-todo: "Need to investigate this struct's layout"
    type: "null"
    x-c-type: "void*"
    x-requires-resolution: true

  # ---------------------------------------------------------------------------
  # Callback Types
  # ---------------------------------------------------------------------------

  callback_func:
    description: |
      Function pointer for custom callbacks. The function body cannot be
      auto-generated as it contains user-specific logic.

      Code generators should:
        1. Default to NULL if not configured by the user
        2. Generate a function template (signature + placeholder comment) if enabled
        3. Link to associated callback_ctx via x-callback-group

      Usage:
        sg_handler:
          type: callback_func
          description: "Custom scatter gather callback"
          x-callback-group: "sg_callback"
          x-callback-signature: "void (*)(void *)"
    type: "null"
    x-c-type: "void (*)(void *)"
    x-default: "NULL"

  callback_ctx:
    description: |
      Context parameter passed to a callback function. This is typically a
      void* that holds user data passed to the callback when invoked.

      Must be paired with a callback_func via x-callback-group. Only takes
      effect if the associated callback is also provided.

      Code generators should:
        1. Default to NULL if not configured
        2. Validate that a matching callback_func exists in the same x-callback-group

      Usage:
        ctx:
          type: callback_ctx
          description: "Parameter for the scatter gather callback"
          x-callback-group: "sg_callback"
    type: "null"
    x-c-type: "void*"
    x-default: "NULL"

# =============================================================================
# Custom Keywords
# =============================================================================
# Extension keywords for no-OS specific metadata

properties:
  x-noos-sources:
    description: |
      Maps the schema to no-OS source files. Used by tooling to locate
      the corresponding C headers and source files.
    type: object
    properties:
      header:
        type: string
        description: "Path to the header file relative to no-OS root"
      source:
        type: string
        description: "Path to the source file relative to no-OS root"
      driver_header:
        type: string
        description: "Path to driver header file"
      driver_source:
        type: string
        description: "Path to driver source file"
      iio_header:
        type: string
        description: "Path to IIO header file"
      iio_source:
        type: string
        description: "Path to IIO source file"

  x-c-type:
    description: "Explicit C type override for code generation"
    type: string

  x-requires-platform-selection:
    description: "Indicates this field requires platform-specific configuration"
    type: boolean

  x-requires-resolution:
    description: "Indicates this field uses an unknown type that needs to be resolved"
    type: boolean

  x-todo:
    description: "Note explaining what needs to be done to resolve an unknown type"
    type: string

  x-default:
    description: "Default value for code generation (e.g., NULL for pointers)"
    type: string

  x-callback-group:
    description: "Links a callback_func and its callback_ctx together"
    type: string

  x-callback-signature:
    description: "The C function signature for a callback_func"
    type: string

# =============================================================================
# Type Keyword Extension
# =============================================================================
# Extends the "type" keyword to accept C types in addition to JSON Schema types

x-extended-types:
  description: "Valid values for the 'type' keyword in no-OS schemas"
  enum:
    # Standard JSON Schema types
    - string
    - number
    - integer
    - boolean
    - array
    - object
    - "null"
    # C integer types
    - uint8_t
    - uint16_t
    - uint32_t
    - uint64_t
    - int8_t
    - int16_t
    - int32_t
    - int64_t
    # Pointer types
    - voidptr
    # Platform abstraction
    - platform_extra
    # Debugging / Placeholder
    - unknown
    # Callback types
    - callback_func
    - callback_ctx
