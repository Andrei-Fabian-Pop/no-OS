# schemas/no-os/no_os_dma_init_param.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "no_os_dma.h/no_os_dma_init_param"
title: "no_os_dma_init_param"
description: "Initialization parameter for the DMA controller"

type: object
properties:
  id:
    type: uint32_t
    description: "Unique id of a DMA controller"

  num_ch:
    type: uint32_t
    description: "The number of channels associated with the controller"

  platform_ops:
    $ref: "types/no_os_dma_platform_ops.yaml"
    description: "Platform specific DMA functions"

  extra:
    type: platform_extra
    description: "Platform specific data"
    x-requires-platform-selection: true
    oneOf:
      - $ref: "../platforms/stm32/stm32_dma_init_param.yaml"

  sg_handler:
    type: callback_func
    description: "Optional custom scatter gather callback. May be set to NULL to use the default one."
    x-callback-group: "sg_callback"
    x-callback-signature: "void (*)(void *)"
    x-default: "NULL"

  ctx:
    type: callback_ctx
    description: "Optional custom parameter for the scatter gather callback. Only takes effect if the handler is also provided."
    x-callback-group: "sg_callback"
    x-default: "NULL"

# Mapping to no-OS source files
x-noos-sources:
  header: "include/no_os_dma.h"
