# schemas/no-os/no_os_spi_init_param.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "no_os_spi.h/no_os_spi_init_param"
title: "no_os_spi_init_param"
description: "Structure holding the parameters for SPI initialization"

type: object
properties:
  device_id:
    type: uint32_t
    description: "Device ID"

  max_speed_hz:
    type: uint32_t
    description: "Maximum transfer speed"

  chip_select:
    type: uint8_t
    description: "SPI chip select"

  mode:
    $ref: "enums/no_os_spi_mode.yaml"
    description: "SPI mode (clock phase and polarity)"

  bit_order:
    $ref: "enums/no_os_spi_bit_order.yaml"
    description: "SPI bit order (MSB/LSB)"

  lanes:
    $ref: "enums/no_os_spi_lanes.yaml"
    description: "SPI number of lanes"

  platform_ops:
    $ref: "types/no_os_spi_platform_ops.yaml"
    description: "SPI platform specific functions"

  platform_delays:
    $ref: "no_os_platform_spi_delays.yaml"
    description: "SPI delays"

  extra:
    type: platform_extra
    description: "SPI extra parameters (platform specific)"
    x-requires-platform-selection: true
    oneOf:
      - $ref: "../platforms/maxim/*/max_spi_init_param.yaml"
      - $ref: "../platforms/stm32/*/stm32_spi_init_param.yaml"
      - $ref: "../platforms/xilinx/*/xil_spi_init_param.yaml"

  parent:
    $ref: "no_os_spi_desc.yaml"
    description: "Parent of the device"

# Mapping to no-OS source files
x-noos-sources:
  header: "include/no_os_spi.h"
