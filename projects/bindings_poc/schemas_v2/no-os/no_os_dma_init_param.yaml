$id: "no-os/no_os_dma_init_param.yaml"
$type: struct
$name: no_os_dma_init_param
$description: "Initialization parameter for the DMA controller"
$sources:
  header: "include/no_os_dma.h"

id:
  type: uint32_t
  description: "Unique id of a DMA controller"

num_ch:
  type: uint32_t
  description: "The number of channels associated with the controller"

platform_ops:
  include: "no-os/platform_ops/no_os_dma_platform_ops.yaml"
  description: "Platform specific DMA functions"

extra:
  type: platform_extra
  description: "Platform specific data"
  platforms:
    - include: "platforms/stm32/stm32_dma_init_param.yaml"

sg_handler:
  type: callback_func
  signature: "void (*)(void *)"
  default: "NULL"
  description: "Optional custom scatter gather callback"

ctx:
  type: callback_ctx
  default: "NULL"
  description: "Optional custom parameter for the scatter gather callback"
