# Meta-schema: Rules for writing no-OS binding schemas
# This file describes the structure and constraints for all schema files

version: 1

# =============================================================================
# Top-level fields (prefixed with $)
# =============================================================================
metadata_fields:
  $id:
    required: true
    type: string
    description: File path relative to schemas_v2 root (e.g., "devices/adi,adxl355.yaml")

  $type:
    required: true
    type: string
    allowed_values: [struct, enum, platform_ops]
    description: The type of schema being defined

  $name:
    required: true
    type: string
    description: The C identifier name (e.g., "adxl355_init_param", "no_os_spi_mode")

  $description:
    required: true
    type: string
    description: Human-readable description of the struct or enum

  $sources:
    required: false
    type: object
    description: |
      Source files required by this schema. Used by metadata2makefile to include
      only the sources needed by configured features. Sources are only included
      when the field has a value set (value != null).
    fields:
      headers:
        type: array
        items: string
        description: Header files relative to no-OS root (e.g., "include/no_os_spi.h")
      sources:
        type: array
        items: string
        description: Source files relative to no-OS root (e.g., "drivers/api/no_os_spi.c")
      api:
        type: object
        description: API layer sources (no_os_*.c/h files)
        properties:
          headers:
            type: array
            items: string
            description: API header files (e.g., "no_os_dma.h")
          sources:
            type: array
            items: string
            description: API source files (e.g., "no_os_dma.c")
      platform:
        type: object
        description: Platform driver sources (maxim_*.c/h, stm32_*.c/h files)
        properties:
          headers:
            type: array
            items: string
            description: Platform header files (e.g., "maxim_dma.h")
          sources:
            type: array
            items: string
            description: Platform source files (e.g., "maxim_dma.c")
      sdk:
        type: object
        description: Vendor SDK dependencies
        properties:
          headers:
            type: array
            items: string
            description: SDK header files (e.g., "spi.h", "dma.h")
          sources:
            type: array
            items: string
            description: SDK source files
      $note:
        type: string
        description: Optional documentation about why these sources are needed

# =============================================================================
# Schema types
# =============================================================================
schema_types:
  struct:
    description: Defines a C struct with properties
    top_level_fields:
      - $id
      - $type
      - $name
      - $description
      - $sources
    properties:
      description: All other top-level keys are struct properties

  enum:
    description: Defines a C enum with named values
    top_level_fields:
      - $id
      - $type
      - $name
      - $description
      - $sources
      - values
      - default
    fields:
      values:
        required: true
        type: object
        description: Map of enum value names to their descriptions
      default:
        required: false
        type: string
        description: Default enum value (must be one of the values keys)

  platform_ops_impl:
    description: Defines a platform-specific implementation of operations struct
    top_level_fields:
      - $id
      - $type
      - $name
      - symbol
      - $sources
    fields:
      symbol:
        required: true
        type: string
        description: The C symbol name (e.g., max_spi_ops)
      $sources:
        required: true
        type: object
        description: Platform-specific headers and sources
        properties:
          headers:
            type: array
            items: string
            description: Header files for this platform (no-OS platform drivers)
          sources:
            type: array
            items: string
            description: Source files for this platform (no-OS platform drivers)
          sdk:
            type: object
            description: SDK dependencies (vendor SDK headers/sources)
            properties:
              headers:
                type: array
                items: string
                description: SDK header files required by this platform
              sources:
                type: array
                items: string
                description: SDK source files required by this platform

# =============================================================================
# Property definitions (for struct properties)
# =============================================================================
property_fields:
  # One of these is required (mutually exclusive)
  type:
    required_unless: include
    type: string
    description: The type of this property
    allowed_values:
      primitives:
        - uint8_t
        - uint16_t
        - uint32_t
        - uint64_t
        - int8_t
        - int16_t
        - int32_t
        - int64_t
        - bool
        - size_t
      special:
        - enum # Inline enum definition
        - union # Union type with selector
        - const_ptr # Constant pointer to another type
        - platform_extra # Platform-specific void* field

  include:
    required_unless: type
    type: string
    description: Path to another schema file to include (relative to schemas_v2 root)

  # Optional fields
  required:
    required: false
    type: bool
    default: false
    description: Whether this property must be configured by the user

  description:
    required: false
    type: string
    description: Human-readable description of the property

  default:
    required: false
    type: any
    description: |
      Default value for the property. When a default is specified, the field
      contributes its $sources to the makefile even without an explicit value set.

  # Note: In configuration output, properties also have a "value" field
  # See configuration_fields section for details.

# =============================================================================
# Special type definitions
# =============================================================================
special_types:
  enum:
    description: Inline enum definition within a struct
    fields:
      type:
        value: enum
      values:
        required: true
        type: list
        description: List of enum value names
      default:
        required: false
        type: string
        description: Default enum value

  union:
    description: Union type where one member is active based on a selector
    fields:
      type:
        value: union
      selector:
        required: true
        type: string
        description: Name of the property that determines the active member
      members:
        required: true
        type: object
        description: |
          Map of selector values to member definitions.
          Each member is an object with property definitions.

  const_ptr:
    description: Constant pointer to another type
    fields:
      type:
        value: const_ptr
      target:
        required: true
        type: string
        description: The type being pointed to

  platform_extra:
    description: Platform-specific void* field with multiple possible types
    fields:
      type:
        value: platform_extra
      platforms:
        required: true
        type: list
        description: List of possible platform-specific schemas
        items:
          include:
            type: string
            description: Path to platform schema file

  platform_ops:
    description: Platform-specific operations const pointer with multiple implementations
    fields:
      type:
        value: platform_ops
      target:
        required: true
        type: string
        description: The C type name of the operations struct (e.g., no_os_spi_platform_ops)
      platforms:
        required: true
        type: list
        description: List of platform-specific operation implementations
        items:
          include:
            type: string
            description: Path to platform_ops_impl schema file

# =============================================================================
# Override definitions (for constraint overrides and mutual exclusion)
# =============================================================================
# Schemas can define constraints on their properties or relationships between
# properties using the $override field. This supports conditional constraints,
# mutual exclusion, and parent property overrides.

override_fields:
  $override:
    required: false
    type: array
    description: |
      List of constraint rules applied to this schema's properties.
      Each array item can be one of the following types:
        - $if/$then: Conditional constraint
        - $mutex: Mutual exclusion between properties
        - $parent: Overrides for parent struct properties
    items:
      oneOf:
        - $ref: "#/override_types/conditional_if_then"
        - $ref: "#/override_types/mutex"
        - $ref: "#/override_types/switch"
    example: |
      $override:
        - $if:
            spi_init:
              value: $any
          $then:
            i2c_init:
              disabled: true

        - $mutex: [spi_init, i2c_init]

override_types:
  # Conditional overrides - if/then syntax
  conditional_if_then:
    description: |
      Apply constraints conditionally based on another property's value.
      When the condition is true, apply the constraints in $then.
    syntax:
      $if:
        type: object
        description: |
          Condition object. Keys are property names, values are match criteria.
          Special value "$any" matches any non-null value.
        example:
          spi_init:
            value: $any
      $then:
        type: object
        description: |
          Constraints to apply when condition is true.
          Keys are property names, values are constraint objects.
        example:
          i2c_init:
            disabled: true
    example: |
      # If spi_init has any value set, disable i2c_init
      - $if:
          spi_init:
            value: $any
        $then:
          i2c_init:
            disabled: true

      # If device_id is 1, restrict chip_select to max 3
      - $if:
          device_id:
            value: 1
        $then:
          chip_select:
            maximum: 3

  # Mutual exclusion constraint
  mutex:
    description: |
      Declares that only one of the listed properties can have a value set.
      This is a shorthand for multiple $if/$then rules.
    syntax:
      $mutex:
        type: array
        items: string
        description: List of property names that are mutually exclusive
    example: |
      # Only one of spi_init, i2c_init, or uart_init can be configured
      - $mutex: [spi_init, i2c_init, uart_init]

  # Conditional overrides - switch/case syntax
  switch:
    description: |
      Apply different constraints based on a selector property's value.
      More readable than multiple if/then blocks for multi-value conditions.
    syntax:
      $switch:
        $on:
          type: string
          description: The property name to switch on
        $cases:
          type: object
          description: |
            Map of selector values to constraint objects.
            Use "_" (underscore) as the default/fallback case.
    example: |
      $switch:
        $on: device_id
        $cases:
          0:
            chip_select:
              maximum: 3
          1:
            chip_select:
              maximum: 4
          _:
            chip_select:
              maximum: 4

  # Parent property overrides (for platform extra structs)
  parent:
    description: |
      Override constraints on parent struct properties.
      Used when this struct is the "extra" field of a parent init_param struct.
    syntax:
      $parent:
        type: object
        description: |
          Contains overrides for properties in the parent struct.
          Keys are property names from the parent, values are constraint objects.
    example: |
      # In max_spi_init_param, override parent no_os_spi_init_param constraints
      $override:
        $parent:
          max_speed_hz:
            maximum: 48000000

# Constraint actions that can be applied in $then or $cases
constraint_actions:
  disabled:
    type: boolean
    description: |
      When true, the property cannot be configured (must remain null).
      Used for mutual exclusion or conditional feature disabling.
  required:
    type: boolean
    description: When true, the property must have a value set.
  minimum:
    type: number
    description: Minimum allowed value for numeric properties.
  maximum:
    type: number
    description: Maximum allowed value for numeric properties.
  allowed_values:
    type: array
    description: Restrict property to specific values from the list.

# Special match values used in $if conditions
special_match_values:
  $any:
    description: |
      Matches any non-null value. Use in $if conditions to check if a property
      has been configured without caring about the specific value.
    example: |
      $if:
        spi_init:
          value: $any  # Matches if spi_init has any value set

# =============================================================================
# Configuration output fields
# =============================================================================
# When schemas are expanded to configuration.json, additional fields are added
# to support runtime configuration.

configuration_fields:
  value:
    type: any
    description: |
      The user-configured value for this property. Set to null by default.
      Only fields with value != null contribute their $sources to the makefile.
      This enables minimal builds based on actual configuration.
    example: |
      "device_id": {
        "$type": "uint32_t",
        "value": null,  // Not configured - sources not included
        "$required": true
      }
      "device_id": {
        "$type": "uint32_t",
        "value": 0,  // Configured - sources included
        "$required": true
      }

# =============================================================================
# Naming conventions
# =============================================================================
naming_conventions:
  instruction_fields:
    description: |
      All fields that are schema instructions (not user-configurable data)
      must be prefixed with $. This distinguishes metadata from actual
      struct properties.
    examples:
      - $id
      - $type
      - $name
      - $description
      - $sources
      - $default
      - $required
      - $override
      - $members
      - $selector
      - $struct_type
      - $enum_type
    counter_examples:
      - type      # Use $type
      - default   # Use $default for instructions, 'default' only in enum values
      - required  # Use $required

  property_names:
    description: |
      Property names (struct fields) should match the C identifier exactly.
      Do not prefix with $ unless it's an instruction field.
    examples:
      - device_id
      - max_speed_hz
      - platform_ops
      - extra
